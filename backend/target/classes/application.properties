spring.application.name=chapter-and-co-backend
server.port=8080

# PostgreSQL — reuses the same DB as the Next.js frontend
spring.datasource.url=jdbc:postgresql://localhost:5432/chapter_and_co
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — validate schema only (do not alter Prisma-managed tables)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# SpringDoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
app.jwt.secret=chapter-and-co-super-secret-jwt-key-change-in-production-must-be-256bits
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.chapterandco=INFO
