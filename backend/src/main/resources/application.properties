spring.application.name=chapter-and-co-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL — reuses the same DB as the Next.js frontend
# Credentials come from the environment (12-factor); defaults are for local dev only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chapter_and_co?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — validate schema only (do not alter Prisma-managed tables)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# SpringDoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
# Set JWT_SECRET (>= 32 bytes) in every non-local environment.
app.jwt.secret=${JWT_SECRET:chapter-and-co-super-secret-jwt-key-change-in-production-must-be-256bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator — observability + Kubernetes/OpenShift probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# Logging
logging.level.com.chapterandco=${LOG_LEVEL:INFO}
