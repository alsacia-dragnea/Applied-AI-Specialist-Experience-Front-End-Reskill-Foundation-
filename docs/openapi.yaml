openapi: 3.0.3
info:
  title: Chapter & Co. API
  description: REST API for the Chapter & Co. eCommerce Bookstore
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Development server

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
  schemas:
    Book:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        price: { type: number }
        compareAtPrice: { type: number, nullable: true }
        coverUrl: { type: string, nullable: true }
        bestseller: { type: boolean }
        featured: { type: boolean }
        stock: { type: integer }
        author:
          type: object
          properties:
            name: { type: string }
    Order:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED] }
        subtotal: { type: number }
        shippingCost: { type: number }
        giftPointsUsed: { type: integer }
        giftPointsDiscount: { type: number }
        total: { type: number }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /books:
    get:
      summary: List books
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, newest, title_asc, bestseller]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 12, maximum: 48 }
      responses:
        '200':
          description: Paginated list of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      pages: { type: integer }

  /recommendations:
    get:
      summary: Get book recommendations
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
                  reason:
                    type: string
                    enum: [personalized, featured]

  /addresses:
    get:
      summary: Get user addresses
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of addresses
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create address
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [fullName, line1, city, postalCode, country]
              properties:
                fullName: { type: string }
                line1: { type: string }
                line2: { type: string }
                city: { type: string }
                state: { type: string }
                postalCode: { type: string }
                country: { type: string, minLength: 2, maxLength: 2 }
                isDefault: { type: boolean }
      responses:
        '201':
          description: Address created
        '401':
          description: Unauthorized

  /gift-points:
    get:
      summary: Get gift points balance
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Points balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: integer }

  /checkout:
    post:
      summary: Place an order
      security:
        - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [addressId, paymentMethod, items]
              properties:
                addressId: { type: string }
                paymentMethod: { type: string, enum: [DEMO_CARD, GIFT_POINTS] }
                cardLast4: { type: string, maxLength: 4 }
                giftPointsToRedeem: { type: integer, minimum: 0 }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      bookId: { type: string }
                      quantity: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }
                  reference: { type: string }
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /orders:
    get:
      summary: Get order history
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }

  /orders/{id}:
    get:
      summary: Get order detail
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order detail
        '404':
          description: Order not found
    patch:
      summary: Cancel an order
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [cancel] }
      responses:
        '200':
          description: Order cancelled
        '400':
          description: Cannot cancel (past 48hrs or already cancelled)
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: User created
        '409':
          description: Email already in use
        '422':
          description: Validation error
