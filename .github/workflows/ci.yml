name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify 2>&1 | tee build.log
        shell: bash -o pipefail {0}
      - name: Incident triage summary (on failure)
        if: failure()
        working-directory: .
        run: |
          {
            echo "## Build failure triage"
            echo
            echo "Pattern summary from \`scripts/triage-logs.sh\`. Classify with \`docs/INCIDENT-PLAYBOOK.md\` or hand this to the \`incident-triager\` agent."
            echo
            echo '```'
            scripts/triage-logs.sh backend/build.log
            echo '```'
            echo
            echo "Failing tests:"
            echo '```'
            grep -hE "FAIL|ERROR\]  " backend/build.log | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/chapter-and-co-backend-*.jar

  openapi-lint:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint docs/openapi.yaml
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml --skip-rule=no-empty-servers --skip-rule=operation-4xx-response --skip-rule=no-server-example.com --skip-rule=info-license

  image:
    name: Build & publish container image
    needs: backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
