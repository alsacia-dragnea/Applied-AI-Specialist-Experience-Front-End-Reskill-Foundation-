name: chapter-and-co

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chapter_and_co
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d chapter_and_co"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/chapter_and_co
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes) in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # "validate" expects the Prisma schema; CI sets DDL_AUTO=create for an empty throwaway DB
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
    ports:
      - "8080:8080"

volumes:
  pgdata:
