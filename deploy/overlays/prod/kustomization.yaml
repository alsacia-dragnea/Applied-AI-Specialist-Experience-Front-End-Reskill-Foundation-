apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chapter-and-co-prod
resources:
  - ../../base
  - route.yaml
# CI/GitOps bumps the tag to an immutable commit SHA, e.g. `kustomize edit set image ... :<sha>`
images:
  - name: ghcr.io/alsacia-dragnea/applied-ai-specialist-experience-front-end-reskill-foundation-/backend
    newTag: latest
