apiVersion: v1
kind: Service
metadata:
  name: chapter-and-co-backend
  labels:
    app: chapter-and-co-backend
spec:
  selector:
    app: chapter-and-co-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chapter-and-co-backend
data:
  DB_URL: jdbc:postgresql://postgres:5432/chapter_and_co?stringtype=unspecified
  CORS_ALLOWED_ORIGINS: http://localhost:3000
